<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>女童套装 · 商品卡片</title>
<style>
:root{--orange:#f36b32;--ink:#20242a;--muted:#737b86;--line:#e8eaed;--bg:#f5f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1500px;margin:auto;padding:26px 22px 60px}h1{font-size:25px;margin:0 0 6px}.sub{color:var(--muted);font-size:13px;margin-bottom:18px}.toolbar{position:sticky;top:0;z-index:5;background:rgba(245,246,248,.96);backdrop-filter:blur(8px);padding:10px 0 14px;border-bottom:1px solid var(--line);margin-bottom:18px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.filters select,.search{height:38px;border:1px solid #d9dde2;background:#fff;border-radius:9px;padding:0 12px;color:#39414b;font-size:13px}.search{min-width:220px}.categories{display:flex;gap:8px;overflow:auto;padding:3px 1px 5px}.cat{white-space:nowrap;border:1px solid #dedfe3;background:#fff;border-radius:999px;padding:8px 14px;color:#414750;cursor:pointer}.cat.active{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}.count{font-size:13px;color:var(--muted);margin:12px 0}.summary{background:#fff;border-radius:12px;padding:15px;margin:0 0 16px;box-shadow:0 1px 4px #1f29330e}.summary h2{font-size:15px;margin:0 0 10px}.summary-row{display:grid;grid-template-columns:90px 1fr;gap:10px;padding:8px 0;border-top:1px solid #f0f1f3;font-size:13px;line-height:1.65}.summary-row b{color:#52606d}.summary .muted{color:#969da6}.path{white-space:pre-line}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px}.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px #1f29330e;cursor:zoom-in;transition:.18s}.card:hover{transform:translateY(-3px);box-shadow:0 8px 22px #1f293321}.photo{aspect-ratio:4/5;background:#f1f1f1}.photo img{width:100%;height:100%;object-fit:cover;display:block}.info{padding:10px 11px 12px}.name{font-size:13px;font-weight:600;overflow-wrap:anywhere;margin-bottom:6px}.id{font-size:11px;color:#98a0aa;margin-bottom:8px}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{background:#fff1e9;color:#d95a24;border-radius:5px;padding:3px 6px;font-size:10px}.empty{grid-column:1/-1;text-align:center;padding:70px 10px;color:var(--muted);background:#fff;border-radius:12px}.lightbox{display:none;position:fixed;inset:0;z-index:20;background:#101216ed;align-items:center;justify-content:center;padding:30px}.lightbox.open{display:flex}.lightbox img{max-width:min(90vw,850px);max-height:86vh;object-fit:contain;border-radius:8px}.close,.nav{position:absolute;border:0;color:white;background:#ffffff26;cursor:pointer}.close{right:24px;top:18px;font-size:30px;background:none}.nav{top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;font-size:24px}.prev{left:20px}.next{right:20px}.caption{position:absolute;bottom:18px;color:white;font-size:13px;background:#0007;padding:5px 12px;border-radius:20px}@media(max-width:600px){.wrap{padding:18px 12px 45px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.search{flex:1;min-width:130px}.nav{width:40px;height:40px}.prev{left:8px}.next{right:8px}.summary-row{grid-template-columns:72px 1fr}}
</style></head>
<body><main class="wrap"><h1>女童套装 · 商品卡片</h1><div class="sub" id="subtitle">加载商品数据中…</div>
<section class="toolbar"><div class="filters"><select id="season"><option value="">全部季节</option></select><select id="age"><option value="">全部年龄</option></select><select id="holiday"><option value="">全部节日</option></select><select id="style"><option value="">全部风格</option></select><input id="search" class="search" placeholder="搜索商品编号或商品ID"></div><nav id="categories" class="categories"></nav></section>
<div id="count" class="count"></div><section id="summary" class="summary" hidden></section><section id="grid" class="grid"></section></main>
<div id="lightbox" class="lightbox"><button class="close" aria-label="关闭">×</button><button class="nav prev" aria-label="上一张">‹</button><img alt="商品大图"><button class="nav next" aria-label="下一张">›</button><div class="caption"></div></div>
<script>
const DATA_FILE='products.csv', SUMMARY_FILE='category-summary.csv', IMAGE_DIR='images/';let products=[],summaries=[],filtered=[],current=-1,activeCategory='全部';
function parseCSV(text){text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell.replace(/\r$/,''));if(row.some(x=>x.trim()))rows.push(row);return rows}
function splitTags(v){return String(v||'').split(/[，,、;；|]/).map(x=>x.trim()).filter(Boolean)}
function unique(key){return [...new Set(products.flatMap(p=>splitTags(p[key])))].sort((a,b)=>a.localeCompare(b,'zh-CN'))}
function buildSelect(id,key,label){const s=document.getElementById(id);for(const x of unique(key)){const o=document.createElement('option');o.value=x;o.textContent=x;s.appendChild(o)}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function imageURL(name){return IMAGE_DIR+String(name||'').trim().split('/').map(encodeURIComponent).join('/')}
function renderCategories(){const names=['全部',...new Set(products.map(p=>p['一级品类']).filter(Boolean))];const nav=document.getElementById('categories');nav.innerHTML='';for(const name of names){const b=document.createElement('button');b.className='cat'+(name===activeCategory?' active':'');b.textContent=name;b.onclick=()=>{activeCategory=name;renderCategories();render()};nav.appendChild(b)}}
function renderSummary(){const box=document.getElementById('summary');if(activeCategory==='全部'){box.hidden=true;box.innerHTML='';return}const rows=summaries.filter(s=>s['一级类目']===activeCategory);box.hidden=false;if(!rows.length){box.innerHTML=`<h2>${esc(activeCategory)} · 类目总结</h2><div class="summary-row"><b>价格带</b><span class="muted">category-summary.csv 中暂无该类目的价格带，请检查一级类目名称是否一致。</span></div><div class="summary-row"><b>类目路径</b><span class="muted">当前表格没有提供类目路径字段，可在 category-summary.csv 中补充。</span></div>`;return}const priceRows=rows.filter(r=>r['价格带']&&r['价格带'].trim());const paths=[...new Set(rows.map(r=>r['类目路径']).filter(v=>v&&v.trim()))];const priceHtml=priceRows.length?priceRows.map(r=>`${r['细分']?esc(r['细分'])+' · ':''}${r['国家']?esc(r['国家'])+'：':''}${esc(r['价格带']).replace(/\n/g,'<br>')}`).join('<br>'):'<span class="muted">暂未填写</span>';box.innerHTML=`<h2>${esc(activeCategory)} · 类目总结</h2><div class="summary-row"><b>价格带</b><span>${priceHtml}</span></div><div class="summary-row"><b>类目路径</b><span class="path">${paths.length?paths.map(esc).join('<br>'):'<span class="muted">待补充：请在 category-summary.csv 的“类目路径”列填写该一级类目从上级到当前类目的完整路径</span>'}</span></div>`}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const selected={季节标签:document.getElementById('season').value,年龄标签:document.getElementById('age').value,'节日标签（选填）':document.getElementById('holiday').value,风格标签:document.getElementById('style').value};filtered=products.filter(p=>(activeCategory==='全部'||p['一级品类']===activeCategory)&&Object.entries(selected).every(([k,v])=>!v||splitTags(p[k]).includes(v))&&(!q||[p['商品编号'],p['商品ID']].some(x=>String(x||'').toLowerCase().includes(q))));document.getElementById('count').textContent=`显示 ${filtered.length} 件商品`;renderSummary();const grid=document.getElementById('grid');if(!filtered.length){grid.innerHTML='<div class="empty">没有符合条件的商品。请检查筛选条件或 products.csv 数据。</div>';return}grid.innerHTML=filtered.map((p,i)=>{const tags=['季节标签','年龄标签','节日标签（选填）','风格标签'].flatMap(k=>splitTags(p[k]));return `<article class="card" data-index="${i}"><div class="photo"><img loading="lazy" src="${esc(imageURL(p['图片文件名']))}" alt="${esc(p['商品编号']||'商品图片')}" onerror="this.onerror=null;this.src='';this.alt='图片未找到：请核对图片文件名与 images 文件夹' "></div><div class="info"><div class="name">${esc(p['商品编号']||'未填写编号')}</div><div class="id">${p['商品ID']?`商品ID：${esc(p['商品ID'])}`:'商品ID未填写'}</div><div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div></article>`}).join('');grid.querySelectorAll('.card').forEach(el=>el.onclick=()=>openImage(Number(el.dataset.index)))}
function openImage(i){current=i;const p=filtered[i];const box=document.getElementById('lightbox');box.querySelector('img').src=imageURL(p['图片文件名']);box.querySelector('.caption').textContent=`${p['商品编号']||''}${p['商品ID']?' · ID '+p['商品ID']:''}（${i+1}/${filtered.length}）`;box.classList.add('open')}
function move(n){if(!filtered.length)return;current=(current+n+filtered.length)%filtered.length;openImage(current)}
document.querySelectorAll('.filters select').forEach(s=>s.addEventListener('change',render));document.getElementById('search').addEventListener('input',render);document.querySelector('.close').onclick=()=>document.getElementById('lightbox').classList.remove('open');document.querySelector('.prev').onclick=()=>move(-1);document.querySelector('.next').onclick=()=>move(1);document.getElementById('lightbox').onclick=e=>{if(e.target.id==='lightbox')e.currentTarget.classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('lightbox').classList.remove('open');if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});
Promise.all([fetch(DATA_FILE).then(r=>{if(!r.ok)throw Error('读取不到 products.csv');return r.text()}),fetch(SUMMARY_FILE).then(r=>r.ok?r.text():'')]).then(([text,summaryText])=>{const rows=parseCSV(text);if(!rows.length)throw Error('products.csv 是空文件');const headers=rows[0].map(x=>x.trim());products=rows.slice(1).map(row=>Object.fromEntries(headers.map((h,i)=>[h,(row[i]||'').trim()]))).filter(p=>p['图片文件名']);if(summaryText){const sr=parseCSV(summaryText);if(sr.length){const sh=sr[0].map(x=>x.trim());summaries=sr.slice(1).map(row=>Object.fromEntries(sh.map((h,i)=>[h,(row[i]||'').trim()])))}}buildSelect('season','季节标签');buildSelect('age','年龄标签');buildSelect('holiday','节日标签（选填）');buildSelect('style','风格标签');document.getElementById('subtitle').textContent=`共 ${products.length} 件商品 · 图片由 images 文件夹加载`;renderCategories();render()}).catch(err=>{document.getElementById('count').textContent='网页没有读到商品数据';document.getElementById('grid').innerHTML=`<div class="empty">${esc(err.message)}。请把模板“商品数据”工作表另存为 UTF-8 CSV，并命名为 products.csv，放到 index.html 同一层。</div>`});
</script></body></html>
